; ============================================================
; Globals
; ============================================================
[globals]
OPERATOR_EXT=1001
VM_CONTEXT=default

; ============================================================
; from-ht812: inbound from HT812V2 FXS ports
; Calls arriving here go straight into the main IVR.
; ============================================================
[from-ht812]
exten => _X!,1,NoOp(Inbound from ${CALLERID(num)} on ${CHANNEL})
 same => n,Goto(ivr-main,s,1)

exten => s,1,Goto(ivr-main,s,1)

; ============================================================
; ivr-main: DTMF-based main menu
; ============================================================
[ivr-main]
exten => s,1,Answer(500)
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=10)
 same => n(loop),Background(tt-weasels)       ; replace with custom prompt
 same => n,WaitExten(10)
 same => n,Playback(goodbye)
 same => n,Hangup()

; 1 → Sales / department 1
exten => 1,1,Playback(digits/1)
 same => n,Verbose(1,Caller ${CALLERID(num)} pressed 1 - Sales)
 same => n,Goto(ivr-main,s,loop)

; 2 → Support / department 2
exten => 2,1,Playback(digits/2)
 same => n,Verbose(1,Caller ${CALLERID(num)} pressed 2 - Support)
 same => n,Goto(ivr-main,s,loop)

; 0 → Operator (extension 1001)
exten => 0,1,Verbose(1,Caller ${CALLERID(num)} pressed 0 - Operator)
 same => n,Dial(PJSIP/${OPERATOR_EXT},30,tT)
 same => n,VoiceMail(${OPERATOR_EXT}@${VM_CONTEXT},u)
 same => n,Hangup()

; 9 → Dynamic AGI-driven IVR
exten => 9,1,Verbose(1,Caller ${CALLERID(num)} entering AGI IVR)
 same => n,Goto(ivr-agi,s,1)

; * → ARI Stasis app (programmatic control)
exten => *,1,Verbose(1,Caller ${CALLERID(num)} entering ARI app)
 same => n,Stasis(ivr-app)
 same => n,Hangup()

; Voicemail check
exten => 8,1,VoiceMailMain(${CALLERID(num)}@${VM_CONTEXT})
 same => n,Goto(ivr-main,s,loop)

; Invalid digit
exten => i,1,Playback(invalid)
 same => n,Goto(ivr-main,s,loop)

; Timeout (no digit pressed)
exten => t,1,Playback(goodbye)
 same => n,Hangup()

; Hangup handler
exten => h,1,Verbose(1,Call from ${CALLERID(num)} ended)

; ============================================================
; ivr-agi: AGI-driven dynamic IVR
; ============================================================
[ivr-agi]
exten => s,1,Answer(200)
 same => n,AGI(ivr_dynamic.py)
 same => n,Hangup()

exten => h,1,Verbose(1,AGI IVR call ended)
