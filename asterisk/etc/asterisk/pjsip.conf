; ============================================================
; Transport
; ============================================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ============================================================
; HT812V2 FXS Port 1 — SIP extension 1001
; ============================================================
[1001]
type=endpoint
transport=transport-udp
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1001
aors=aor1001
; Send OPTIONS keepalives so NAT mappings stay open
qualify_frequency=30
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
; password loaded from env via sed on container start — see Dockerfile entrypoint
password=CHANGEME_SIP_1001_PASS

[aor1001]
type=aor
max_contacts=2
remove_existing=yes

; ============================================================
; HT812V2 FXS Port 2 — SIP extension 1002
; ============================================================
[1002]
type=endpoint
transport=transport-udp
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1002
aors=aor1002
qualify_frequency=30
direct_media=no

[auth1002]
type=auth
auth_type=userpass
username=1002
password=CHANGEME_SIP_1002_PASS

[aor1002]
type=aor
max_contacts=2
remove_existing=yes
