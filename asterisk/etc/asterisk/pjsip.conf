; ============================================================
; Transports — TCP primary, UDP fallback
; TCP is more reliable on macOS Docker Desktop and avoids NAT
; keep-alive issues when running 2 simultaneous FXS lines.
; ============================================================
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ============================================================
; HT812V2 FXS Port 1 — SIP extension 1001
; ============================================================
[1001]
type=endpoint
transport=transport-tcp
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1001
aors=aor1001
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
password=Mitake123

[aor1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ============================================================
; HT812V2 FXS Port 2 — SIP extension 1002
; ============================================================
[1002]
type=endpoint
transport=transport-tcp
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1002
aors=aor1002
direct_media=no

[auth1002]
type=auth
