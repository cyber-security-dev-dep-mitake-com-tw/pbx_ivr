; ============================================================
; Transports — TCP primary, UDP fallback
; TCP is more reliable on macOS Docker Desktop and avoids NAT
; keep-alive issues when running 2 simultaneous FXS lines.
; ============================================================
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_client=no
verify_server=no

; ============================================================
; HT812V2 FXS Port 1 — SIP extension 1001
; NOTE: AOR name MUST match the SIP username (To-header user)
;       that the device sends in its REGISTER request.
; ============================================================
[1001]
type=endpoint
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1001
aors=1001
direct_media=no
callerid="Line 1001" <1001>

[auth1001]
type=auth
auth_type=userpass
username=1001
password=Mitake123

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ============================================================
; HT812V2 FXS Port 2 — SIP extension 1002
; ============================================================
[1002]
type=endpoint
context=from-ht812
disallow=all
allow=ulaw,alaw
auth=auth1002
aors=1002
direct_media=no
callerid="Line 1002" <1002>

[auth1002]
type=auth
auth_type=userpass
username=1002
password=Mitake123

[1002]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30
