services:

  asterisk:
    build: ./asterisk
    container_name: asterisk
    restart: unless-stopped
    env_file: .env
    ports:
      - "5060:5060/tcp"           # SIP signaling (PJSIP) — TCP primary
      - "5060:5060/udp"           # SIP signaling — UDP fallback
      - "8088:8088"               # ARI HTTP / WebSocket
      - "10000-10100:10000-10100/udp"  # RTP media streams
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk   # live-reload config without rebuild
      - asterisk_spool:/var/spool/asterisk       # voicemail, recordings
      - asterisk_log:/var/log/asterisk
    networks:
      - pbx
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ht812_api:
    build: ./ht812_api
    container_name: ht812_api
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKUP_KEEP=30
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/backups          # config snapshot storage
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach HT812V2 on LAN
    networks:
      - pbx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ari_app:
    build: ./ari_app
    container_name: ari_app
    restart: unless-stopped
    env_file: .env
    environment:
      - ARI_ENABLE_RECORDING=false
      - EVENTS_API_URL=http://ht812_api:8000/events
    depends_on:
      asterisk:
        condition: service_healthy
    networks:
      - pbx
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build: ./web
    container_name: pbx_ivr_web
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      ht812_api:
        condition: service_healthy
    networks:
      - pbx

volumes:
  asterisk_spool:
  asterisk_log:

networks:
  pbx:
    driver: bridge
